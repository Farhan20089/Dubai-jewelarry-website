    <script>
      (function() {
        try {
          var t = localStorage.getItem('theme');
          if (!t) {
            var raw = localStorage.getItem('dgj_theme_v1');
            if (raw) {
              try { t = JSON.parse(raw); } catch (e) { t = raw; }
            }
          }
          if (t !== 'light' && t !== 'dark') {
            t = 'dark';
          }
          document.documentElement.classList.add(t);
          document.documentElement.classList.remove(t === 'dark' ? 'light' : 'dark');
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-stone-950 text-stone-100 antialiased selection:bg-amber-600/30 selection:text-amber-200">

  </body>
